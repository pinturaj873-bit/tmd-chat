{% extends "base.html" %}{% block content %}<section class="card chat"><div class="chathead"><h2>{{chat.title}}</h2><small>{{members|length}} members</small></div><div id="messages">{% for m in messages %}<div class="msg {% if m.user_id==user.id %}mine{% endif %}"><b>{{m.name}}</b><div>{{m.body}}</div>{% if m.file_url %}<a href="{{m.file_url}}" target="_blank">{{m.file_name or 'Attachment'}}</a>{% endif %}</div>{% endfor %}</div><form id="send"><input id="body" placeholder="Type a message..." autocomplete="off"><button>Send</button></form></section><script>const cid={{chat.id}};async function send(e){e.preventDefault();const x=document.getElementById('body');if(!x.value.trim())return;await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:cid,body:x.value,message_type:'text'})});x.value='';load()}async function load(){const r=await fetch('/api/messages/'+cid);const a=await r.json();document.getElementById('messages').innerHTML=a.map(m=>'<div class="msg '+(m.user_id==={{user.id}}?'mine':'')+'"><b>'+m.name+'</b><div>'+esc(m.body)+'</div></div>').join('')}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}document.getElementById('send').onsubmit=send;setInterval(load,2000)</script>{% endblock %}
