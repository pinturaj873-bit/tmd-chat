<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1288e8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>{% block title %}TMD Chat{% endblock %}</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icon.svg"><link rel="stylesheet" href="/static/style.css"></head>
<body class="{% block body_class %}{% endblock %}"><div class="app-shell">
{% if session.get('user_id') %}<header class="topbar"><a class="brand" href="/home"><span class="brand-mark">TMD</span><span>TMD Chat</span></a><div class="top-actions"><a href="/home" class="top-link">Chats</a><a href="/link" class="top-link">Link Computer</a><a href="/logout" class="top-link">Logout</a></div></header>{% endif %}
<main class="{% if session.get('user_id') %}app-main{% endif %}">{% block content %}{% endblock %}</main></div><script src="/static/app.js"></script>{% block scripts %}{% endblock %}</body></html>
